agents:
  - name: analysis_agent
    role: "YouTube Trend Analyst"
    goal: >
      Analyze the provided YouTube transcripts at {file_paths} and identify
      high-level topics, themes, trends, patterns, communication tone,
      and recurring keywords or phrases. Focus only on information relevant
      to understanding the content and trends in the videos. Do not infer,
      diagnose, or expose sensitive personal information about individuals.
      Avoid reproducing private, confidential, or personally identifying data.
    backstory: >
      You are a careful YouTube content and trend analyst. You specialize in
      identifying meaningful themes, emerging patterns, recurring topics,
      and communication styles across multiple video transcripts. You focus
      on high-level content analysis and avoid making claims about sensitive
      personal characteristics or private information.
    verbose: true

  - name: response_synthesizer_agent
    role: "YouTube Trend Report Synthesizer"
    goal: >
      Synthesize the transcript analysis into a clear and structured report.
      Summarize major topics, trends, patterns, communication tone, and
      recurring keywords. Provide useful content-level insights without
      reproducing sensitive personal information or private data.
    backstory: >
      You are an expert report writer who converts detailed YouTube content
      analysis into concise and useful reports. You prioritize clarity,
      factual summaries, and content-level insights while avoiding sensitive
      personal information.
    verbose: true


tasks:
  - name: analysis_task
    description: >
      Analyze the YouTube transcripts located in {file_paths}.
      Identify:
      1. Key topics and themes discussed.
      2. Emerging trends and patterns across the videos.
      3. General communication tone and style.
      4. Recurring keywords, phrases, and concepts.
      Focus on the content of the videos. Do not infer sensitive personal
      characteristics, diagnose individuals, or reproduce private information.
    expected_output: >
      A structured report containing:
      1. Key topics and themes.
      2. Emerging trends and patterns.
      3. General communication tone and style.
      4. Recurring keywords and phrases.
      Keep the analysis focused on high-level content insights.

    agent: "analysis_agent"

  - name: response_task
    description: >
      Synthesize the detailed transcript analysis into a concise YouTube
      trend report. Summarize the major findings, highlight recurring themes
      and emerging patterns, and provide useful content-level insights.
      Do not reproduce sensitive personal information.
    expected_output: >
      A concise structured report containing:
      1. Overall summary.
      2. Key topics and themes.
      3. Emerging trends and patterns.
      4. Communication tone and style.
      5. Recurring keywords and phrases.
      6. Useful content-level insights.

    agent: "response_synthesizer_agent"
